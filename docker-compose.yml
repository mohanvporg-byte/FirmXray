services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: firmxray
      POSTGRES_PASSWORD: firmxray
      POSTGRES_DB: firmxray
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://firmxray:firmxray@postgres:5432/firmxray
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080
    depends_on: [postgres, redis]
    ports: ["4000:4000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  pgdata:
